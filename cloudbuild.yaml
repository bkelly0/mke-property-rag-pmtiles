substitutions:
  _REGION: us-central1
  _REPO: app-images
  _JOB_NAME: mke-property-rag-pmtiles
  _SERVICE_ACCOUNT: mke-property-rag-pmtiles-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _SOURCE_URI: 
  _DEST_URI: 

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_JOB_NAME}:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_JOB_NAME}:${SHORT_SHA}'

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_JOB_NAME}:latest'
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_JOB_NAME}:${SHORT_SHA}'
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_JOB_NAME}'

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - '${_JOB_NAME}'
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_JOB_NAME}:latest
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}
      - --set-env-vars=SOURCE_URI=${_SOURCE_URI},DEST_URI=${_DEST_URI}
      - --memory=512Mi
      - --cpu=1
      - --task-timeout=3600

options:
  logging: CLOUD_LOGGING_ONLY